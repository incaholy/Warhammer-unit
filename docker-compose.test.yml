# Overlay for running the suite in a container against a throwaway Postgres:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build \
#       --abort-on-container-exit --exit-code-from api
# (Or `make docker-test`.) Data lives in tmpfs so nothing persists between runs;
# the api service runs pytest instead of uvicorn.
#
# This is the Postgres parity tier (ROADMAP R6): TEST_DATABASE_URL makes conftest
# build the schema by running the real migrations, so the containerized run
# actually exercises Postgres — not SQLite, which is what it silently did before.
#
# Postgres writes to PGDATA (a tmpfs path here) rather than the base compose's
# named volume, so test data is ephemeral without having to un-merge that mount.
services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-warhammer_unit_test}
      PGDATA: /var/lib/postgresql/tmpdata
    tmpfs:
      - /var/lib/postgresql/tmpdata

  api:
    environment:
      # Parity tier: conftest reads TEST_DATABASE_URL (not DATABASE_URL) and builds
      # the schema via `alembic upgrade head`. A plain pytest ignores it → SQLite.
      TEST_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-warhammer}:${POSTGRES_PASSWORD:-warhammer}@db:5432/${POSTGRES_TEST_DB:-warhammer_unit_test}
      # Tests don't need production secret enforcement; dev lets app.main import
      # without a real SECRET_KEY.
      APP_ENV: dev
    command: ["pytest", "tests/", "-v"]
